<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Chat</title>
    <style>
        :root {
            --bg-color: #0c0813;
            --main-purple: #c084fc;
            --glow-purple: rgba(192, 132, 252, 0.4);
            --btn-bg: #1e1330;
            --btn-hover: #2e1d4a;
            --text-color: #f3e8ff;
            --red-color: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .logo-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 60px;
        }

        .logo-glow {
            position: absolute;
            width: 240px;
            height: 240px;
            background: var(--glow-purple);
            filter: blur(60px);
            border-radius: 50%;
            z-index: 1;
            animation: breatheGlow 4s ease-in-out infinite alternate;
            transition: all 0.5s ease;
        }

        .ai-photo-logo {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            z-index: 2;
            border: 4px solid var(--main-purple);
            box-shadow: 0 0 30px var(--glow-purple);
            animation: floatLogo 4s ease-in-out infinite alternate;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ai-photo-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== ВЫКЛЮЧЕНО: логотип серый ===== */
        .ui-disabled .ai-photo-logo {
            transform: scale(0.88);
            animation-play-state: paused;
            filter: grayscale(0.9) contrast(0.7) brightness(0.5);
            border-color: #475569;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .ui-disabled .logo-glow {
            animation-play-state: paused;
            opacity: 0.1;
        }

        .controls-panel {
            display: flex;
            gap: 40px;
            z-index: 5;
        }

        .btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background-color: var(--btn-bg);
            border: 2px solid rgba(192, 132, 252, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .btn svg {
            width: 26px;
            height: 26px;
            fill: var(--text-color);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--main-purple);
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(192, 132, 252, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Красная черта перечеркивания (скрыта по умолчанию) */
        .mic-off-line {
            display: none;
            stroke: var(--red-color);
            stroke-width: 3;
            stroke-linecap: round;
        }

        /* Микрофон ВЫКЛЮЧЕН: кнопка красная, черта видна */
        .ui-disabled .btn-mic {
            background-color: rgba(244, 63, 94, 0.2) !important;
            border-color: var(--red-color) !important;
        }

        .ui-disabled .btn-mic svg {
            fill: var(--red-color) !important;
        }

        .ui-disabled .btn-mic .mic-off-line {
            display: block !important;
        }

        /* Кнопка "Забыть" */
        .btn-forget:hover svg {
            fill: #fbbf24;
        }

        .toast {
            position: absolute;
            bottom: 40px;
            background-color: rgba(30, 19, 48, 0.95);
            border: 1px solid var(--main-purple);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes floatLogo {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.03); }
        }

        @keyframes breatheGlow {
            0% { opacity: 0.4; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- ui-disabled сразу тут: лого серый, кнопка красная с чертой -->
    <div class="logo-container ui-disabled" id="interactionZone">
        <div class="logo-glow"></div>
        <div class="ai-photo-logo">
            <img src="center-logo.jpg" alt="AI Logo">
        </div>
    </div>

    <div class="controls-panel">
        <!-- Кнопка микрофона -->
        <button class="btn btn-mic" id="btnMic" title="Включить/Выключить микрофон">
            <svg viewBox="0 0 24 24">
                <!-- Сам микрофон -->
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                <!-- Линия перечеркивания (сделана через path для 100% отображения) -->
                <path class="mic-off-line" d="M3 3 L21 21" />
            </svg>
        </button>

        <!-- Кнопка "Забыть" -->
        <button class="btn btn-forget" id="btnForget" title="Забыть диалог">
            <svg viewBox="0 0 24 24">
                <path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/>
            </svg>
        </button>
    </div>

    <div class="toast" id="toastNotify">Диалог очищен</div>

    <script>
        const zone = document.getElementById('interactionZone');
        const btnMic = document.getElementById('btnMic');
        const btnForget = document.getElementById('btnForget');
        const toast = document.getElementById('toastNotify');

        let isListening = false;
        let isProcessing = false;
        let history = [];
        let recognitionActive = false;
        
        const SYSTEM_PROMPT = `Ты — голосовой ИИ-помощник. Твои ответы будут озвучиваться, поэтому:
1. НИКОГДА не пиши программный код, скрипты или HTML-разметку. Ты голосовой ассистент, а не программист.
2. При решении математических примеров НЕ используй символы +, -, *, /. Вместо этого пиши словами: "плюс", "минус", "умножить на", "разделить на". Например, вместо "2+2=4" пиши "два плюс два равно четыре".
3. Отвечай кратко и естественно, как в устной беседе.`;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.continuous = true;

            recognition.onstart = () => {
                recognitionActive = true;
            };

            recognition.onresult = async (event) => {
                const lastResult = event.results.length - 1;
                if (event.results[lastResult].isFinal) {
                    const userText = event.results[lastResult][0].transcript;
                    console.log('Вы сказали:', userText);
                    await sendToAI(userText);
                }
            };

            recognition.onerror = (event) => {
                console.error('Ошибка микрофона:', event.error);
                if (event.error === 'not-allowed') {
                    showToast('Разрешите доступ к микрофону в настройках браузера');
                }
                recognitionActive = false;
                isListening = false;
                zone.classList.add('ui-disabled');
            };

            recognition.onend = () => {
                recognitionActive = false;
                // Если мы не выключали его вручную, перезапускаем
                if (isListening) {
                    try { recognition.start(); } catch (e) {}
                }
            };
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        async function sendToAI(userMessage) {
            if (isProcessing) return;
            isProcessing = true;
            showToast('Думаю...');

            const messages = [
                { role: 'system', content: SYSTEM_PROMPT },
                ...history.slice(-6),
                { role: 'user', content: userMessage }
            ];

            try {
                const response = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai',
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const aiText = data.choices[0].message.content;
                console.log('ИИ ответил:', aiText);

                history.push({ role: 'user', content: userMessage });
                history.push({ role: 'assistant', content: aiText });
                if (history.length > 6) history = history.slice(-6);

                speakText(aiText);
            } catch (error) {
                console.error('Ошибка API:', error);
                showToast('Ошибка соединения с ИИ');
            } finally {
                isProcessing = false;
            }
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        btnMic.addEventListener('click', () => {
            if (!recognition) {
                showToast('Браузер не поддерживает микрофон');
                return;
            }

            if (isListening) {
                isListening = false;
                zone.classList.add('ui-disabled');
                // Используем abort() вместо stop(), чтобы не сбрасывать разрешение
                try { recognition.abort(); } catch (e) {}
                window.speechSynthesis.cancel();
                showToast('Микрофон выключен');
            } else {
                isListening = true;
                zone.classList.remove('ui-disabled');
                if (!recognitionActive) {
                    try { recognition.start(); } catch (e) {}
                }
                window.speechSynthesis.cancel();
                showToast('Слушаю...');
            }
        });

        btnForget.addEventListener('click', () => {
            history = [];
            window.speechSynthesis.cancel();
            isListening = false;
            zone.classList.add('ui-disabled');
            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }
            showToast('Диалог очищен');
        });
    </script>
</body>
</html>
