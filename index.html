<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c0813;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; padding: 20px;
        }
        .logo-container {
            position: relative; width: 280px; height: 280px;
            display: flex; justify-content: center; align-items: center; margin-bottom: 60px;
        }
        /* Неровные аудиоволны бегут по окружности логотипа */
        .logo-container::before,
        .logo-container::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 180ms ease-out, transform 180ms ease-out;
        }
        .ui-speaking::before,
        .ui-speaking::after {
            opacity: 1;
            background:
                conic-gradient(from 0deg,
                    transparent 0deg 8deg,
                    rgba(52,211,153,.95) 8deg 12deg,
                    transparent 12deg 27deg,
                    rgba(52,211,153,.28) 27deg 30deg,
                    transparent 30deg 48deg,
                    rgba(52,211,153,.8) 48deg 54deg,
                    transparent 54deg 78deg,
                    rgba(52,211,153,.5) 78deg 81deg,
                    transparent 81deg 104deg,
                    rgba(52,211,153,.95) 104deg 109deg,
                    transparent 109deg 137deg,
                    rgba(52,211,153,.35) 137deg 141deg,
                    transparent 141deg 164deg,
                    rgba(52,211,153,.85) 164deg 171deg,
                    transparent 171deg 204deg,
                    rgba(52,211,153,.45) 204deg 208deg,
                    transparent 208deg 238deg,
                    rgba(52,211,153,.9) 238deg 244deg,
                    transparent 244deg 271deg,
                    rgba(52,211,153,.35) 271deg 275deg,
                    transparent 275deg 309deg,
                    rgba(52,211,153,.85) 309deg 315deg,
                    transparent 315deg 342deg,
                    rgba(52,211,153,.55) 342deg 346deg,
                    transparent 346deg 360deg);
            -webkit-mask: radial-gradient(circle, transparent 0 69%, #000 70% 74%, transparent 75%);
            mask: radial-gradient(circle, transparent 0 69%, #000 70% 74%, transparent 75%);
            animation: orbitWave 1.25s linear infinite, orbitJitter 0.42s ease-in-out infinite alternate;
        }
        .ui-speaking::after {
            inset: 0;
            animation-duration: 1.7s, 0.31s;
            animation-direction: reverse, alternate-reverse;
            filter: blur(1px);
            opacity: .72;
        }
        .ui-speaking-fade::before,
        .ui-speaking-fade::after {
            opacity: 0;
            transform: scale(1.08);
            transition: opacity 220ms ease-out, transform 220ms ease-out;
            animation-play-state: paused;
        }
        @keyframes orbitWave {
            from { rotate: 0deg; }
            to { rotate: 360deg; }
        }
        @keyframes orbitJitter {
            0% { scale: 0.97; }
            35% { scale: 1.035; }
            70% { scale: 0.99; }
            100% { scale: 1.045; }
        }
        .logo-glow {
            position: absolute; width: 240px; height: 240px;
            background: rgba(192, 132, 252, 0.4); filter: blur(60px);
            border-radius: 50%; z-index: 1;
            animation: breatheGlow 4s ease-in-out infinite alternate;
            transition: all 0.4s ease;
        }
        .ai-photo-logo {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%; overflow: hidden; z-index: 2;
            border: 4px solid #c084fc; box-shadow: 0 0 30px rgba(192, 132, 252, 0.4);
            animation: floatLogo 4s ease-in-out infinite alternate;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .ai-photo-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .ui-disabled .ai-photo-logo {
            transform: scale(0.88); animation-play-state: paused;
            filter: grayscale(0.9) contrast(0.7) brightness(0.5);
            border-color: #475569; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .ui-disabled .logo-glow { animation-play-state: paused; opacity: 0.1; }

        .ui-listening .ai-photo-logo { border-color: #c084fc; box-shadow: 0 0 30px rgba(192, 132, 252, 0.6); }
        .ui-listening .logo-glow { background: rgba(192, 132, 252, 0.4); }
        .ui-speaking-fade .ai-photo-logo,
        .ui-speaking-fade .ai-photo-logo img,
        .ui-speaking-fade .logo-glow {
            animation-play-state: paused;
            transition: transform 220ms ease-out, box-shadow 220ms ease-out, opacity 220ms ease-out;
        }

        .ui-thinking .logo-glow { background: rgba(251, 191, 36, 0.5); opacity: 0.8; }
        .ui-thinking .ai-photo-logo { border-color: #fbbf24; box-shadow: 0 0 30px rgba(251, 191, 36, 0.6); }

        .ui-speaking .logo-glow {
            background: rgba(52, 211, 153, 0.5);
            opacity: 0.95;
            animation: speakingGlow 0.85s ease-in-out infinite alternate;
        }
        .ui-speaking .ai-photo-logo {
            border-color: #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.6);
            animation: speakingPulse 0.62s ease-in-out infinite alternate;
        }
        /* Круг мягко пульсирует, словно ИИ произносит слова */
        .ui-speaking .ai-photo-logo img {
            animation: speakingImage 0.62s ease-in-out infinite alternate;
        }
        @keyframes speakingPulse {
            0% { transform: scale(1); box-shadow: 0 0 24px rgba(52, 211, 153, 0.35); }
            100% { transform: scale(1.055); box-shadow: 0 0 48px rgba(52, 211, 153, 0.9); }
        }
        @keyframes speakingImage {
            0% { transform: scale(1); }
            100% { transform: scale(1.025); }
        }
        @keyframes speakingGlow {
            0% { transform: scale(0.94); opacity: 0.55; }
            100% { transform: scale(1.18); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .ui-speaking .ai-photo-logo,
            .ui-speaking .ai-photo-logo img,
            .ui-speaking .logo-glow,
            .ui-speaking::before,
            .ui-speaking::after {
                animation-duration: 2s;
            }
        }

        .ui-empty .logo-glow { background: rgba(249, 115, 22, 0.6); opacity: 1; }
        .ui-empty .ai-photo-logo { border-color: #f97316; box-shadow: 0 0 40px rgba(249, 115, 22, 0.8); }

        .controls-panel { display: flex; gap: 40px; z-index: 5; margin-bottom: 20px; }
        .btn {
            width: 68px; height: 68px; border-radius: 50%;
            background-color: #1e1330; border: 2px solid rgba(192, 132, 252, 0.2);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; outline: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .btn svg { width: 26px; height: 26px; fill: #f3e8ff; transition: all 0.3s ease; z-index: 2; }
        .btn:hover { background-color: #2e1d4a; border-color: #c084fc; transform: translateY(-4px); box-shadow: 0 12px 28px rgba(192, 132, 252, 0.3); }
        .btn:active { transform: translateY(1px); }
        .btn-forget:hover svg { fill: #fbbf24; }

        .red-line {
            position: absolute; width: 44px; height: 4px; background-color: #f43f5e;
            border-radius: 2px; transform: rotate(45deg) scale(0); opacity: 0;
            z-index: 10; box-shadow: 0 0 8px rgba(244, 63, 94, 0.8); pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .ui-disabled .btn-mic { background-color: rgba(244, 63, 94, 0.2) !important; border-color: #f43f5e !important; }
        .ui-disabled .btn-mic svg { fill: #94a3b8 !important; }
        .ui-disabled .btn-mic .red-line { transform: rotate(45deg) scale(1) !important; opacity: 1 !important; }

        .toast {
            position: fixed; top: 20px; background-color: rgba(30, 19, 48, 0.95);
            border: 1px solid #c084fc; color: #f3e8ff; padding: 12px 24px;
            border-radius: 30px; font-size: 14px; opacity: 0; transform: translateY(-20px);
            transition: all 0.4s ease; pointer-events: none; z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        @keyframes floatLogo { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-10px) scale(1.03); } }
        @keyframes breatheGlow { 0% { opacity: 0.4; transform: scale(1); } 100% { opacity: 0.7; transform: scale(1.1); } }

        /* СКРЫТАЯ ПАНЕЛЬ ЛОГОВ */
        .debug-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50vh;
            background: rgba(0, 0, 0, 0.95); border-top: 2px solid #c084fc;
            color: #a3e635; font-family: monospace; font-size: 12px;
            padding: 10px; overflow-y: auto; z-index: 9999;
            display: none; flex-direction: column;
            white-space: pre-wrap;
        }
        .debug-panel.active { display: flex; }
    </style>
</head>
<body>

    <div class="logo-container ui-disabled" id="interactionZone">
        <div class="logo-glow"></div>
        <div class="ai-photo-logo"><img src="/center-logo.jpg" alt="AI Logo"></div>
    </div>
    
    <div class="controls-panel">
        <button class="btn btn-mic" id="btnMic">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            <div class="red-line"></div>
        </button>
        <button class="btn btn-forget" id="btnForget"><svg viewBox="0 0 24 24"><path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/></svg></button>
    </div>

    <div class="toast" id="toastNotify">Диалог очищен</div>
    <div class="debug-panel" id="debugPanel"></div>

    <script>
        // Так как index.html лежит на том же сервере, что и API, используем относительный путь
        const SERVER_URL = ''; 

        const zone = document.getElementById('interactionZone');
        const btnMic = document.getElementById('btnMic');
        const btnForget = document.getElementById('btnForget');
        const toast = document.getElementById('toastNotify');
        const debugPanel = document.getElementById('debugPanel');

        let isListening = false;
        let isProcessing = false;
        let isSpeaking = false;
        let ttsTimeout = null;
        let restartTimeout = null;
        let isSessionActive = false;
        
        // ИСТОРИЯ ДИАЛОГА (загружаем из localStorage)
        let chatHistory = JSON.parse(localStorage.getItem('ai_chat_history')) || [];
        
        const VOICE_LANG = 'ru-RU';
        
        let forgetClickCount = 0;
        let debugModeActive = false;

        function debugLog(msg, type = 'info') {
            if (!debugModeActive) return;
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f43f5e' : type === 'warn' ? '#fbbf24' : '#a3e635';
            const logLine = document.createElement('div');
            logLine.style.color = color;
            logLine.textContent = `[${time}] ${msg}`;
            debugPanel.appendChild(logLine);
            debugPanel.scrollTop = debugPanel.scrollHeight;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        function updateMicUI(state) {
            const line = btnMic.querySelector('.red-line');
            if (state === 'disabled') {
                zone.className = 'logo-container ui-disabled';
                btnMic.style.backgroundColor = 'rgba(244, 63, 94, 0.2)';
                btnMic.style.borderColor = '#f43f5e';
                btnMic.querySelector('svg').style.fill = '#94a3b8';
                if (line) { line.style.transform = 'rotate(45deg) scale(1)'; line.style.opacity = '1'; }
            } else if (state === 'listening') {
                zone.className = 'logo-container ui-listening';
                btnMic.style.backgroundColor = ''; btnMic.style.borderColor = ''; btnMic.querySelector('svg').style.fill = '';
                if (line) { line.style.transform = 'rotate(45deg) scale(0)'; line.style.opacity = '0'; }
            } else if (state === 'thinking') {
                zone.className = 'logo-container ui-thinking';
                btnMic.style.backgroundColor = ''; btnMic.style.borderColor = ''; btnMic.querySelector('svg').style.fill = '';
                if (line) { line.style.transform = 'rotate(45deg) scale(0)'; line.style.opacity = '0'; }
            } else if (state === 'speaking') {
                zone.className = 'logo-container ui-speaking';
                btnMic.style.backgroundColor = ''; btnMic.style.borderColor = ''; btnMic.querySelector('svg').style.fill = '';
                if (line) { line.style.transform = 'rotate(45deg) scale(0)'; line.style.opacity = '0'; }
            } else if (state === 'empty') {
                zone.className = 'logo-container ui-empty';
                btnMic.style.backgroundColor = ''; btnMic.style.borderColor = ''; btnMic.querySelector('svg').style.fill = '';
                if (line) { line.style.transform = 'rotate(45deg) scale(0)'; line.style.opacity = '0'; }
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = VOICE_LANG;
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onstart = () => { 
                isListening = true; 
                updateMicUI('listening'); 
                debugLog('STT: Слушаю...');
            };
            
            recognition.onresult = async (event) => {
                if (isSpeaking) return;
                const userText = event.results[0][0].transcript.trim();
                debugLog(`STT: Распознан текст: "${userText}"`);
                
                if (userText === "") {
                    isListening = false;
                    updateMicUI('empty');
                    if (isSessionActive) restartTimeout = setTimeout(startListening, 1200);
                    return;
                }
                isListening = false;
                await sendToAI(userText);
            };
            
            recognition.onerror = (event) => {
                isListening = false;
                debugLog(`STT Ошибка: ${event.error}`, 'error');
                if (isSessionActive && !isSpeaking && !isProcessing) {
                    updateMicUI('listening');
                    restartTimeout = setTimeout(startListening, 1500);
                } else if (!isSessionActive) {
                    updateMicUI('disabled');
                }
            };
            
            recognition.onend = () => {
                isListening = false;
                if (isSessionActive && !isProcessing && !isSpeaking) {
                    restartTimeout = setTimeout(startListening, 1500);
                }
            };
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function cleanTextForTTS(text) {
            if (!text) return "";
            let clean = text.replace(/[*#_`~]/g, '');
            clean = clean.replace(/\s+/g, ' ').trim();
            return clean;
        }

        async function sendToAI(userMessage) {
            if (isProcessing) return;
            isProcessing = true;
            updateMicUI('thinking');
            
            debugLog(`API: Отправка запроса с историей (${chatHistory.length} сообщ.)...`);

            try {
                const response = await fetch(`${SERVER_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: userMessage,
                        history: chatHistory // Отправляем историю на сервер
                    })
                });

                debugLog(`API: Получен статус ${response.status}`);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value, { stream: true });
                }
                
                if (fullText) {
                    // ДОБАВЛЯЕМ В ИСТОРИЮ И СОХРАНЯЕМ
                    chatHistory.push({ role: "user", content: userMessage });
                    chatHistory.push({ role: "assistant", content: fullText });
                    
                    if (chatHistory.length > 10) {
                        chatHistory = chatHistory.slice(-10);
                    }
                    localStorage.setItem('ai_chat_history', JSON.stringify(chatHistory));
                    
                    const cleanText = cleanTextForTTS(fullText);
                    speakText(cleanText);
                } else {
                    debugLog('API: Пустой ответ', 'warn');
                    updateMicUI('empty');
                    if (isSessionActive) restartTimeout = setTimeout(startListening, 1500);
                }
            } catch (error) {
                debugLog(`API Ошибка: ${error.message}`, 'error');
                if (isSessionActive) {
                    updateMicUI('empty');
                    restartTimeout = setTimeout(startListening, 2000);
                } else {
                    updateMicUI('disabled');
                }
            } finally {
                isProcessing = false;
            }
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            if (ttsTimeout) clearTimeout(ttsTimeout);
            if (restartTimeout) clearTimeout(restartTimeout);

            window.speechSynthesis.cancel();
            isSpeaking = true;
            updateMicUI('speaking');
            debugLog('TTS: Говорю...');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = VOICE_LANG;
            utterance.rate = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const ruVoice = voices.find(v => v.lang.includes('ru'));
            if (ruVoice) utterance.voice = ruVoice;

            const onTTSEnd = () => {
                if (!isSpeaking) return;
                isSpeaking = false;
                debugLog('TTS: Закончил');

                // Быстро и плавно гасим волны, затем возвращаем обычный режим слушания.
                zone.classList.add('ui-speaking-fade');
                setTimeout(() => {
                    zone.classList.remove('ui-speaking-fade');
                    if (isSessionActive) {
                        updateMicUI('listening');
                        restartTimeout = setTimeout(startListening, 350);
                    } else {
                        updateMicUI('disabled');
                    }
                }, 230);
            };

            utterance.onend = onTTSEnd;
            utterance.onerror = onTTSEnd;

            const estimatedTime = (text.length / 10) * 1000 + 2000;
            ttsTimeout = setTimeout(() => {
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    onTTSEnd();
                }
            }, estimatedTime);

            window.speechSynthesis.speak(utterance);
        }

        function startListening() {
            if (!recognition) return;
            if (isListening || isSpeaking || isProcessing) return;
            if (restartTimeout) clearTimeout(restartTimeout);
            updateMicUI('disabled');
            try {
                recognition.start();
            } catch (e) {
                if (isSessionActive) restartTimeout = setTimeout(startListening, 1500);
            }
        }

        btnMic.addEventListener('click', () => {
            if (forgetClickCount >= 5 && !debugModeActive) {
                debugModeActive = true;
                debugPanel.classList.add('active');
                debugLog('СИСТЕМА: Режим отладки активирован!');
                sendToAI('Привет, это тестовый запрос');
                return;
            }

            if (isSessionActive) {
                isSessionActive = false;
                if (isSpeaking) {
                    showToast('Микрофон выключен, ИИ договорит');
                } else {
                    if (recognition) recognition.abort();
                    if (restartTimeout) clearTimeout(restartTimeout);
                    updateMicUI('disabled');
                    showToast('Микрофон выключен');
                }
            } else {
                isSessionActive = true;
                startListening();
            }
        });

        btnForget.addEventListener('click', () => {
            // ОЧИСТКА ИСТОРИИ
            chatHistory = [];
            localStorage.removeItem('ai_chat_history');
            
            isSessionActive = false;
            isListening = false; isSpeaking = false; isProcessing = false;
            if (ttsTimeout) clearTimeout(ttsTimeout);
            if (restartTimeout) clearTimeout(restartTimeout);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (recognition) recognition.abort();
            updateMicUI('disabled');
            showToast('Диалог очищен');
            
            forgetClickCount++;
            setTimeout(() => { if (!debugModeActive) forgetClickCount = 0; }, 2000);
        });

        updateMicUI('disabled');
        if (window.speechSynthesis) window.speechSynthesis.getVoices();
    </script>
</body>
</html>
