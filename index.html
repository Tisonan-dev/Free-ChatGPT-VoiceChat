<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #0c0813;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; padding: 20px;
        }

        .logo-container {
            position: relative; width: 280px; height: 280px;
            display: flex; justify-content: center; align-items: center; margin-bottom: 60px;
        }

        .logo-glow {
            position: absolute; width: 240px; height: 240px;
            background: rgba(192, 132, 252, 0.4); filter: blur(60px);
            border-radius: 50%; z-index: 1;
            animation: breatheGlow 4s ease-in-out infinite alternate;
            transition: all 0.5s ease;
        }

        .ai-photo-logo {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%; overflow: hidden; z-index: 2;
            border: 4px solid #c084fc; box-shadow: 0 0 30px rgba(192, 132, 252, 0.4);
            animation: floatLogo 4s ease-in-out infinite alternate;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ai-photo-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* ===== СТАТУСЫ ===== */
        .ui-disabled .ai-photo-logo {
            transform: scale(0.88); animation-play-state: paused;
            filter: grayscale(0.9) contrast(0.7) brightness(0.5);
            border-color: #475569; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .ui-disabled .logo-glow { animation-play-state: paused; opacity: 0.1; }

        .ui-thinking .logo-glow { background: rgba(251, 191, 36, 0.5); opacity: 0.8; }
        .ui-thinking .ai-photo-logo { border-color: #fbbf24; box-shadow: 0 0 30px rgba(251, 191, 36, 0.6); }

        .ui-speaking .logo-glow { background: rgba(52, 211, 153, 0.5); opacity: 0.8; }
        .ui-speaking .ai-photo-logo { border-color: #34d399; box-shadow: 0 0 30px rgba(52, 211, 153, 0.6); }

        .controls-panel { display: flex; gap: 40px; z-index: 5; }

        .btn {
            width: 68px; height: 68px; border-radius: 50%;
            background-color: #1e1330; border: 2px solid rgba(192, 132, 252, 0.2);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; outline: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }

        .btn svg { width: 26px; height: 26px; fill: #f3e8ff; transition: all 0.3s ease; z-index: 2; }
        .btn:hover { background-color: #2e1d4a; border-color: #c084fc; transform: translateY(-4px); box-shadow: 0 12px 28px rgba(192, 132, 252, 0.3); }
        .btn:active { transform: translateY(1px); }
        .btn-forget:hover svg { fill: #fbbf24; }

        .red-line {
            position: absolute; width: 44px; height: 4px; background-color: #f43f5e;
            border-radius: 2px; transform: rotate(45deg) scale(0); opacity: 0;
            z-index: 10; box-shadow: 0 0 8px rgba(244, 63, 94, 0.8); pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .ui-disabled .btn-mic { background-color: rgba(244, 63, 94, 0.2) !important; border-color: #f43f5e !important; }
        .ui-disabled .btn-mic svg { fill: #94a3b8 !important; }
        .ui-disabled .btn-mic .red-line { transform: rotate(45deg) scale(1) !important; opacity: 1 !important; }

        .toast {
            position: fixed; top: 20px; background-color: rgba(30, 19, 48, 0.95);
            border: 1px solid #c084fc; color: #f3e8ff; padding: 12px 24px;
            border-radius: 30px; font-size: 14px; opacity: 0; transform: translateY(-20px);
            transition: all 0.4s ease; pointer-events: none; z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        @keyframes floatLogo { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-10px) scale(1.03); } }
        @keyframes breatheGlow { 0% { opacity: 0.4; transform: scale(1); } 100% { opacity: 0.7; transform: scale(1.1); } }
    </style>
</head>
<body>

    <div class="logo-container ui-disabled" id="interactionZone">
        <div class="logo-glow"></div>
        <div class="ai-photo-logo">
            <img src="center-logo.jpg" alt="AI Logo">
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn btn-mic" id="btnMic">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
            <div class="red-line"></div>
        </button>

        <button class="btn btn-forget" id="btnForget">
            <svg viewBox="0 0 24 24">
                <path d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/>
            </svg>
        </button>
    </div>

    <div class="toast" id="toastNotify">Диалог очищен</div>

    <script>
        const zone = document.getElementById('interactionZone');
        const btnMic = document.getElementById('btnMic');
        const btnForget = document.getElementById('btnForget');
        const toast = document.getElementById('toastNotify');

        let isListening = false;
        let isProcessing = false;
        let isSpeaking = false;
        let history = [];
        let ttsTimeout = null;
        let isAutoCycle = false; // Флаг для автоматического цикла
        
        const VOICE_LANG = 'ru-RU';

        const SYSTEM_PROMPT = `Ты — голосовой ИИ-помощник. Твои ответы будут озвучиваться, поэтому:
1. НИКОГДА не пиши программный код, скрипты или HTML-разметку. Ты голосовой ассистент, а не программист.
2. При решении математических примеров НЕ используй символы +, -, *, /. Вместо этого пиши словами: "плюс", "минус", "умножить на", "разделить на". Например, вместо "2+2=4" пиши "два плюс два равно четыре".
3. Отвечай кратко и естественно, как в устной беседе.`;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        function updateMicUI(state) {
            const line = btnMic.querySelector('.red-line');
            
            if (state === 'disabled') {
                zone.className = 'logo-container ui-disabled';
                btnMic.style.backgroundColor = 'rgba(244, 63, 94, 0.2)';
                btnMic.style.borderColor = '#f43f5e';
                btnMic.querySelector('svg').style.fill = '#94a3b8';
                if (line) { line.style.transform = 'rotate(45deg) scale(1)'; line.style.opacity = '1'; }
            } 
            else if (state === 'listening') {
                zone.className = 'logo-container';
                btnMic.style.backgroundColor = '';
                btnMic.style.borderColor = '';
                btnMic.querySelector('svg').style.fill = '';
                if (line) { line.style.transform = 'rotate(45deg) scale(0)'; line.style.opacity = '0'; }
            }
            else if (state === 'thinking') {
                zone.className = 'logo-container ui-thinking';
                btnMic.style.backgroundColor = '';
                btnMic.style.borderColor = '';
                btnMic.querySelector('svg').style.fill = '';
                if (line) { line.style.transform = 'rotate(45deg) scale(0)'; line.style.opacity = '0'; }
            }
            else if (state === 'speaking') {
                zone.className = 'logo-container ui-speaking';
                btnMic.style.backgroundColor = '';
                btnMic.style.borderColor = '';
                btnMic.querySelector('svg').style.fill = '';
                if (line) { line.style.transform = 'rotate(45deg) scale(0)'; line.style.opacity = '0'; }
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = VOICE_LANG;
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onstart = () => {
                isListening = true;
                updateMicUI('listening');
            };

            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                console.log('Вы сказали:', userText);
                isListening = false;
                await sendToAI(userText);
            };

            recognition.onerror = (event) => {
                console.error('Ошибка STT:', event.error);
                isListening = false;
                updateMicUI('disabled');
                if (event.error === 'not-allowed') showToast('Разрешите доступ к микрофону');
            };

            recognition.onend = () => {
                if (isListening) {
                    isListening = false;
                    updateMicUI('disabled');
                }
            };
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        async function sendToAI(userMessage) {
            if (isProcessing) return;
            isProcessing = true;
            updateMicUI('thinking');
            showToast('Думаю...');

            const messages = [
                { role: 'system', content: SYSTEM_PROMPT },
                ...history.slice(-6),
                { role: 'user', content: userMessage }
            ];

            try {
                const response = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai',
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const aiText = data.choices[0].message.content;
                console.log('ИИ ответил:', aiText);

                history.push({ role: 'user', content: userMessage });
                history.push({ role: 'assistant', content: aiText });
                if (history.length > 6) history = history.slice(-6);

                speakText(aiText);

            } catch (error) {
                console.error('Ошибка API:', error);
                showToast('Ошибка соединения с ИИ');
                updateMicUI('disabled');
            } finally {
                isProcessing = false;
            }
        }

        function speakText(text) {
            if (!window.speechSynthesis) {
                showToast('Синтез речи не поддерживается');
                updateMicUI('disabled');
                return;
            }

            // Очищаем предыдущие таймеры и речь
            if (ttsTimeout) clearTimeout(ttsTimeout);
            window.speechSynthesis.cancel();
            
            isSpeaking = true;
            updateMicUI('speaking');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = VOICE_LANG;
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const ruVoice = voices.find(v => v.lang.includes('ru'));
            if (ruVoice) utterance.voice = ruVoice;

            // Функция завершения TTS
            const onTTSEnd = () => {
                if (!isSpeaking) return; // Защита от двойного вызова
                isSpeaking = false;
                
                // Автоматически включаем микрофон для следующего вопроса
                if (isAutoCycle) {
                    startListening(true); 
                } else {
                    updateMicUI('disabled');
                }
            };

            utterance.onend = onTTSEnd;
            utterance.onerror = (e) => {
                console.error('Ошибка TTS:', e);
                onTTSEnd();
            };

            // СТРАХОВКА: Если событие onend не сработает (баг мобильных браузеров),
            // таймер принудительно включит микрофон через расчетное время + 1 сек.
            const estimatedTime = (text.length / 10) * 1000 + 1000; // ~10 символов в секунду
            ttsTimeout = setTimeout(() => {
                if (isSpeaking) {
                    console.log('Принудительное завершение TTS по таймеру');
                    window.speechSynthesis.cancel();
                    onTTSEnd();
                }
            }, estimatedTime);

            window.speechSynthesis.speak(utterance);
        }

        function startListening(isAuto = false) {
            if (!recognition) {
                showToast('Браузер не поддерживает микрофон');
                return;
            }
            if (isListening || isSpeaking || isProcessing) return;

            isAutoCycle = isAuto;

            try {
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                recognition.start();
                if (!isAuto) showToast('Слушаю...'); // Показываем тост только при ручном клике
            } catch (e) {
                console.error('Не удалось запустить микрофон', e);
                updateMicUI('disabled');
            }
        }

        btnMic.addEventListener('click', () => {
            // Если идет запись или обработка - выключаем
            if (isListening || isSpeaking || isProcessing) {
                isAutoCycle = false;
                isListening = false;
                isSpeaking = false;
                isProcessing = false;
                
                if (recognition) recognition.abort();
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                if (ttsTimeout) clearTimeout(ttsTimeout);
                
                updateMicUI('disabled');
                showToast('Микрофон выключен');
            } else {
                // Ручное включение
                startListening(false);
            }
        });

        btnForget.addEventListener('click', () => {
            history = [];
            isAutoCycle = false;
            isListening = false;
            isSpeaking = false;
            isProcessing = false;
            
            if (ttsTimeout) clearTimeout(ttsTimeout);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (recognition) recognition.abort();
            
            updateMicUI('disabled');
            showToast('Диалог очищен');
        });

        // Прогрев голосов
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
